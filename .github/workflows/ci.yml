name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mga
          POSTGRES_PASSWORD: mga
          POSTGRES_DB: mga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mga -d mga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (Postgres 16)
        env:
          MGA_TEST_DATABASE_URL: postgresql+psycopg://mga:mga@localhost:5432/mga_test
        run: python -m pytest -q
      - name: Engine evaluation
        run: python -m eval.run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint src

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: mga-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: mga-web:ci
          build-args: |
            MGA_API_URL=http://api:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
